[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=web
    --cov-report=term-missing
    --cov-report=html
markers =
    unit: Unit tests
    integration: Integration tests
    auth: Authentication tests
    pets: Pet management tests
    health: Health tracking tests
    health_records: Health records tests (generic events engine + event-type registry)
    admin: Admin-only tests
    datetime: Datetime parsing tests
    error_handling: Error handling and edge cases tests
    medications: Medication management tests
    documents: Pet document attachment tests
    push: Push notification subscription and reminder tests

filterwarnings =
    ignore:pkg_resources is deprecated as an API:DeprecationWarning:mongomock.__version__
    # mongomock's own internals (index bookkeeping), not anything we call —
    # scoped to that module so a genuine utcnow() deprecation in our own
    # code would still surface.
    ignore:datetime.datetime.utcnow\(\) is deprecated.*:DeprecationWarning:mongomock.helpers

