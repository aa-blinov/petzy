# The scheme the visitor used. The host nginx in front terminates TLS and
# says so in X-Forwarded-Proto; without it (someone opening this nginx
# directly) it's our own scheme. Passing our own $scheme on always told the
# app "http", so it never knew the site was HTTPS.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Who may put a response in a frame. Nobody, except the app's own screen
# showing a document's PDF in its viewer (an <iframe> of /file): the same
# DENY made the browser draw a broken «не позволяет установить соединение»
# frame instead of the PDF. Only that one path, and only the app itself.
map $uri $frame_options {
    default                                DENY;
    ~^/api/documents/[0-9a-f]+/file$       SAMEORIGIN;
}

# The version in the Server header and on every error page nginx writes itself
# (502 from a gunicorn that is down, 413 from an oversized upload) tells a
# stranger exactly which nginx to try. Off everywhere.
server_tokens off;

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    
    # Error logging
    error_log /var/log/nginx/error.log warn;
    access_log /var/log/nginx/access.log;

    # Allow larger file uploads (for pet photos)
    client_max_body_size 20m;

    # Without this, `proxy_pass http://web:5000` below resolves the `web`
    # hostname once (at config load / first request) and caches that IP for
    # as long as this nginx worker lives. When `docker compose up -d`
    # recreates the `web` container (a new backend image, e.g. on every
    # deploy) without also restarting nginx, nginx keeps trying the old,
    # now-gone container IP and every /api/ request gets a 502. Using
    # Docker's embedded DNS (127.0.0.11) with a short TTL, and referencing
    # the upstream through a variable (which forces per-request resolution
    # instead of resolving once at startup), makes nginx pick up a
    # recreated `web` container on its own.
    resolver 127.0.0.11 valid=10s;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    # The host nginx in front talks to this one in HTTP/1.0 (proxy_pass's
    # default), and gzip skips 1.0 requests unless told otherwise: in
    # production every script, stylesheet and API answer went out
    # uncompressed (987 KB for the sign-in page instead of 246 KB).
    gzip_http_version 1.0;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript image/svg+xml application/manifest+json;

    # Brotli compression (if supported)
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/json application/javascript image/svg+xml;

    # The visitor's address. The host nginx in front of this one reaches it
    # from a private address and passes the client in X-Forwarded-For; only
    # a proxy on a private network is believed, so a request sent straight
    # to this nginx from outside can't claim to be someone else. Without
    # this every request looked like it came from the host nginx, and the
    # app's per-IP login limit was one limit for everybody.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Security headers (API answers get their own CSP from the app).
    add_header X-Frame-Options $frame_options always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # API proxy - forward to Flask backend. ^~: without it the static-file
    # regex below (…|json)$ won and /api/openapi.json was looked up among
    # the frontend's files (a 404).
    # Local stand only: docker-compose.local.yml mounts this file in place of nginx.conf. The browser sends
    # uploads to the local storage through the app's own origin, so it makes no request to another port. The
    # signature covers the Host header, so the storage is told the same host the browser used.
    location ^~ /petzy-local/ {
        client_max_body_size 600m;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:3000;
        proxy_pass http://s3:7070;
    }

    location ^~ /api/ {
        set $backend http://web:5000;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # $remote_addr is the visitor already (see set_real_ip_from above):
        # one address, not a list the visitor could have started.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_cache_bypass $http_upgrade;
        # Important for cookies
        proxy_cookie_path / /;
        # Session cookies only ever travel over HTTPS (localhost counts as
        # secure in browsers, so a local run still works).
        proxy_cookie_flags ~ secure samesite=lax;
        # Pass cookies and caching headers from backend
        proxy_pass_header Set-Cookie;
        proxy_pass_header Cache-Control;
        proxy_pass_header ETag;
        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Build output under /assets/ has a content hash in every file name,
    # so it can be cached for good.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # Everything else at the root keeps its name when its content changes
    # (favicon.svg, the icons, sw.js, registerSW.js): revalidate on every
    # use. These used to share the year-long immutable rule above, so a new
    # favicon or manifest never reached anyone who had opened the site.
    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        types { }
        default_type application/manifest+json;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|json)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # The page a vet opens by a link to a pet's medical card (frontend/src/pages/SharedMedicalCard.tsx): the same app, but kept
    # nowhere and not offered to search engines; the API answers for the link say the same.
    location ^~ /share/ {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        include /etc/nginx/security-headers.conf;
    }

    # Someone types the docs address they know from other tools. Without this
    # the SPA fallback below answers it with the app itself, so /docs opens a
    # working page that is not the documentation, which is the worst kind of
    # 404: no error, just the wrong thing. The reference lives at /api/docs.
    # `=` and not a prefix: a prefix here would swallow every other path.
    #
    # absolute_redirect off, so the Location is the bare path and the browser
    # resolves it against the address it is already on. An absolute one would
    # be built from this nginx's own $scheme, which is http behind the host's
    # TLS, sending a visitor off https and back again, and on the stand it
    # would drop the :3000 port. It would also mean building the answer from
    # the client's Host header, which anyone can set.
    location = /docs {
        absolute_redirect off;
        return 301 /api/docs;
    }

    # The address people expect a version at, without the api prefix. nginx only
    # forwards /api/, so this is the one place that makes the short name work.
    location = /version {
        set $backend http://web:5000;
        proxy_pass $backend/api/version;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 10s;
        add_header Cache-Control "no-store" always;
    }

    # React app routes - SPA fallback (everything except the API is the React app, /login included)
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
        # index.html names the current hashed bundle; never serve it stale.
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Health check. `=` so that /health and only /health answers: as a prefix
    # /health/anything passed too, and a health check that passes on nonsense
    # is not a health check.
    location = /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}

