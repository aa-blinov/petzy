# Headers for the app's own pages and files, included in every location
# that sets its own add_header (nginx drops the server-level ones there).
#
# CSP: scripts only from this origin (the theme script is a file for this
# reason), styles also inline (antd sets style attributes) and from Google
# Fonts; the only other host is the bucket, which scans are uploaded to and
# signed files come from, and Sentry's EU ingest for error reports. No
# framing, no plugins, no <base> tricks.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:; img-src 'self' data: blob: https://*.backblazeb2.com; connect-src 'self' https://*.backblazeb2.com https://*.ingest.de.sentry.io; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=31536000" always;
