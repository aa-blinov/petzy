services:
  db:
    image: mongo:latest
    ports:
      # Loopback only: the app, backups and reminders reach it over
      # app-network, and nothing outside the host should. For a GUI
      # client, tunnel in: ssh -L 27017:127.0.0.1:27017 <server>.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodata:/data/db
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASS}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/27017"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  web:
    build: .
    env_file:
      - .env
    environment:
      # Explicitly pass logging configuration
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    command: "gunicorn -c gunicorn.conf.py web.app:app"
    ports:
      # Loopback only. Published on all interfaces, gunicorn was reachable
      # from the internet around nginx: clients that opened a connection
      # and never finished the request pinned every gthread worker thread
      # (they block on the read with no timeout), and the API stopped
      # answering. nginx buffers whole requests, so traffic has to come
      # through it; host-side proxies still reach 127.0.0.1:5001.
      - "127.0.0.1:5001:5000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - static_content:/usr/share/nginx/html
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    volumes:
      - static_content:/usr/share/nginx/html:ro
    depends_on:
      - web
      - frontend
    restart: unless-stopped
    networks:
      - app-network

  mongo-backup:
    image: mongo:latest
    volumes:
      - ./backups:/backups
      - ./scripts:/backup-script:ro
    env_file:
      - .env
    command: ["/backup-script/mongo-backup.sh"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # Polls for medication doses that just became due and sends a Web Push
  # notification for each. Deliberately its own service rather than a
  # thread inside `web` — that service runs several gunicorn worker
  # processes (see gunicorn.conf.py), and an in-process thread there
  # would send every reminder once per worker.
  reminders:
    build: .
    env_file:
      - .env
    command: "python -m scripts.send_medication_reminders"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

volumes:
  mongodata:
  static_content:

networks:
  app-network:
    driver: bridge