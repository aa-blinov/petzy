name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v1
        with:
          args: check --output-format=github
          version: 0.14.9
      - uses: astral-sh/ruff-action@v1
        with:
          args: format --check
          version: 0.14.9

  test-stateless:
    name: Pytest (stateless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mongomock
      - name: Run stateless tests
        run: pytest tests/stateless --tb=short --maxfail=1 -q
        env:
          # Defaults match the values used by tests; real secrets are not needed for mongomock.
          MONGO_USER: test
          MONGO_PASS: test
          MONGO_HOST: localhost
          MONGO_PORT: "27017"
          MONGO_DB: cat_health_test
          FLASK_SECRET_KEY: ci-secret
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD_HASH: $2b$12$dummyhashforCIplaceholdervalueXXXXXXXXXXXXXXXXXXXXX

  frontend:
    name: Frontend (typecheck + build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Lint
        run: npm run lint

  test-stateful:
    name: Pytest (stateful)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mongomock
      - name: Run stateful tests
        run: pytest tests/stateful --tb=short --maxfail=1 -q
        env:
          # Defaults match the values used by tests; real secrets are not needed for mongomock.
          MONGO_USER: test
          MONGO_PASS: test
          MONGO_HOST: localhost
          MONGO_PORT: "27017"
          MONGO_DB: cat_health_test
          FLASK_SECRET_KEY: ci-secret
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD_HASH: $2b$12$dummyhashforCIplaceholdervalueXXXXXXXXXXXXXXXXXXXXX