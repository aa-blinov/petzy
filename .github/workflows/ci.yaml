name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  nginx:
    name: nginx config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nginx -t for every config
        run: |
          set -euo pipefail
          # The host config includes Certbot's files, which exist only on
          # the server; stand-ins at the same paths let nginx -t check the
          # rest of it.
          le="$(mktemp -d)"
          mkdir -p "$le/live/petzy.duckdns.org"
          openssl req -x509 -nodes -newkey rsa:2048 -days 1 -subj "/CN=petzy.test" \
            -keyout "$le/live/petzy.duckdns.org/privkey.pem" -out "$le/live/petzy.duckdns.org/fullchain.pem" 2>/dev/null
          : > "$le/options-ssl-nginx.conf"
          openssl dhparam -dsaparam -out "$le/ssl-dhparams.pem" 2048 2>/dev/null
          for conf in nginx/nginx.conf nginx/nginx.conf.server nginx/nginx.conf.external; do
            echo "== $conf"
            docker run --rm -v "$PWD/$conf:/etc/nginx/conf.d/default.conf:ro" -v "$le:/etc/letsencrypt:ro" nginx:alpine nginx -t
          done
      - name: Caching headers and manifest type (the deployed config)
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/assets"
          echo 'console.log(1)' > "$root/assets/index-abc123.js"
          echo '<svg xmlns="http://www.w3.org/2000/svg"/>' > "$root/favicon.svg"
          echo '{"name":"Petzy"}' > "$root/manifest.webmanifest"
          echo '<!doctype html><title>Petzy</title>' > "$root/index.html"
          # mktemp -d is 0700; nginx's worker user must be able to read it.
          chmod -R a+rX "$root"
          docker run -d --name nginx-check -p 8080:80 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$root:/usr/share/nginx/html:ro" nginx:alpine
          sleep 2
          head() { curl -sI "http://localhost:8080$1" | tr -d '\r'; }
          check() { echo "$2" | grep -qi "$3" || { echo "FAIL $1: expected '$3'"; echo "$2"; exit 1; }; echo "ok   $1: $3"; }
          check /assets/index-abc123.js "$(head /assets/index-abc123.js)" 'cache-control: public, immutable'
          check /favicon.svg "$(head /favicon.svg)" 'cache-control: no-cache'
          check /manifest.webmanifest "$(head /manifest.webmanifest)" 'content-type: application/manifest+json'
          check /manifest.webmanifest "$(head /manifest.webmanifest)" 'cache-control: no-cache'
          check /login "$(head /login)" 'cache-control: no-cache'
          docker rm -f nginx-check >/dev/null

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v1
        with:
          args: check --output-format=github
          version: 0.14.9
      - uses: astral-sh/ruff-action@v1
        with:
          args: format --check
          version: 0.14.9

  test-stateless:
    name: Pytest (stateless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mongomock
      - name: Run stateless tests
        run: pytest tests/stateless --tb=short --maxfail=1 -q
        env:
          # Defaults match the values used by tests; real secrets are not needed for mongomock.
          MONGO_USER: test
          MONGO_PASS: test
          MONGO_HOST: localhost
          MONGO_PORT: "27017"
          MONGO_DB: cat_health_test
          FLASK_SECRET_KEY: ci-secret
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD_HASH: $2b$12$dummyhashforCIplaceholdervalueXXXXXXXXXXXXXXXXXXXXX

  frontend:
    name: Frontend (typecheck + build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Lint
        run: npm run lint

  test-stateful:
    name: Pytest (stateful)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mongomock
      - name: Run stateful tests
        run: pytest tests/stateful --tb=short --maxfail=1 -q
        env:
          # Defaults match the values used by tests; real secrets are not needed for mongomock.
          MONGO_USER: test
          MONGO_PASS: test
          MONGO_HOST: localhost
          MONGO_PORT: "27017"
          MONGO_DB: cat_health_test
          FLASK_SECRET_KEY: ci-secret
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD_HASH: $2b$12$dummyhashforCIplaceholdervalueXXXXXXXXXXXXXXXXXXXXX
  backup:
    name: Backup image (dump, upload, rotate, restore)
    runs-on: ubuntu-latest
    env:
      # A quote and an @ on purpose: the password travels in a config
      # file, and has to survive its quoting.
      MONGO_PASS: 'p@ss"word'
    steps:
      - uses: actions/checkout@v4
      - name: Build the backup image
        run: docker build -f backup/Dockerfile -t petzy-backup .
      - name: MongoDB and an in-memory S3
        run: |
          set -euo pipefail
          docker run -d --name mongo -p 127.0.0.1:27017:27017 \
            -e MONGO_INITDB_ROOT_USERNAME=root -e MONGO_INITDB_ROOT_PASSWORD="$MONGO_PASS" mongo:latest
          pip install --quiet "moto[server]>=5" boto3
          nohup moto_server -H 127.0.0.1 -p 5000 > moto.log 2>&1 &
          for i in $(seq 1 30); do
            docker exec mongo mongosh --quiet -u root -p "$MONGO_PASS" --eval 'db.adminCommand("ping").ok' 2>/dev/null | grep -q 1 && break
            sleep 2
          done
          python - <<'PY'
          import boto3, time
          for _ in range(30):
              try:
                  boto3.client("s3", endpoint_url="http://127.0.0.1:5000", region_name="us-east-1",
                               aws_access_key_id="t", aws_secret_access_key="t").create_bucket(Bucket="petzy-ci")
                  break
              except Exception as e:
                  last = e
                  time.sleep(1)
          else:
              raise SystemExit(f"no bucket: {last}")
          PY
      - name: Seed some data
        run: |
          docker exec mongo mongosh --quiet -u root -p "$MONGO_PASS" --authenticationDatabase admin petzy --eval '
            db.pets.insertMany([{ name: "Рекс" }, { name: "Барсик" }]);
            db.events.insertMany(Array.from({ length: 500 }, (_, i) => ({ i })));'
      - name: Four backups, the newest three kept
        run: |
          set -euo pipefail
          for i in 1 2 3 4; do
            docker run --rm --network host \
              -e MONGO_HOST=127.0.0.1 -e MONGO_PORT=27017 -e MONGO_USER=root -e MONGO_PASS -e MONGO_DB=petzy \
              -e S3_ENDPOINT=http://127.0.0.1:5000 -e S3_REGION=us-east-1 -e S3_BUCKET=petzy-ci \
              -e S3_KEY_ID=t -e S3_SECRET_KEY=t -e BACKUP_KEEP=3 \
              petzy-backup python3 scripts/backup_to_s3.py --once
            sleep 1.1  # backup keys are per second
          done
          python - <<'PY'
          import boto3
          s3 = boto3.client("s3", endpoint_url="http://127.0.0.1:5000", region_name="us-east-1",
                            aws_access_key_id="t", aws_secret_access_key="t")
          keys = sorted(o["Key"] for o in s3.list_objects_v2(Bucket="petzy-ci").get("Contents", []))
          print(keys)
          assert len(keys) == 3 and all(k.startswith("backups/mongo/petzy-") for k in keys), keys
          s3.download_file("petzy-ci", keys[-1], "newest.archive.gz")
          PY
      - name: Restore the newest into a fresh database and compare
        run: |
          set -euo pipefail
          docker cp newest.archive.gz mongo:/tmp/newest.archive.gz
          docker exec mongo mongorestore -u root -p "$MONGO_PASS" --authenticationDatabase admin \
            --archive=/tmp/newest.archive.gz --gzip --nsFrom 'petzy.*' --nsTo 'restored.*' --quiet
          counts() {
            docker exec mongo mongosh --quiet -u root -p "$MONGO_PASS" --authenticationDatabase admin "$1" \
              --eval 'print(db.pets.countDocuments() + "/" + db.events.countDocuments())'
          }
          echo "original: $(counts petzy), restored: $(counts restored)"
          [ "$(counts restored)" = "2/500" ] && [ "$(counts petzy)" = "$(counts restored)" ]
