name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  nginx:
    name: nginx config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: nginx -t for every config
        run: |
          for conf in nginx/nginx.conf nginx/nginx.conf.server nginx/nginx.conf.external; do
            echo "== $conf"
            docker run --rm -v "$PWD/$conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t
          done
      - name: Caching headers and manifest type (the deployed config)
        run: |
          set -euo pipefail
          root="$(mktemp -d)"
          mkdir -p "$root/assets"
          echo 'console.log(1)' > "$root/assets/index-abc123.js"
          echo '<svg xmlns="http://www.w3.org/2000/svg"/>' > "$root/favicon.svg"
          echo '{"name":"Petzy"}' > "$root/manifest.webmanifest"
          echo '<!doctype html><title>Petzy</title>' > "$root/index.html"
          docker run -d --name nginx-check -p 8080:80 \
            -v "$PWD/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
            -v "$root:/usr/share/nginx/html:ro" nginx:alpine
          sleep 2
          head() { curl -sI "http://localhost:8080$1" | tr -d '\r'; }
          check() { echo "$2" | grep -qi "$3" || { echo "FAIL $1: expected '$3'"; echo "$2"; exit 1; }; echo "ok   $1: $3"; }
          check /assets/index-abc123.js "$(head /assets/index-abc123.js)" 'cache-control: public, immutable'
          check /favicon.svg "$(head /favicon.svg)" 'cache-control: no-cache'
          check /manifest.webmanifest "$(head /manifest.webmanifest)" 'content-type: application/manifest+json'
          check /manifest.webmanifest "$(head /manifest.webmanifest)" 'cache-control: no-cache'
          check /login "$(head /login)" 'cache-control: no-cache'
          docker rm -f nginx-check >/dev/null

  lint:
    name: Ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v1
        with:
          args: check --output-format=github
          version: 0.14.9
      - uses: astral-sh/ruff-action@v1
        with:
          args: format --check
          version: 0.14.9

  test-stateless:
    name: Pytest (stateless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mongomock
      - name: Run stateless tests
        run: pytest tests/stateless --tb=short --maxfail=1 -q
        env:
          # Defaults match the values used by tests; real secrets are not needed for mongomock.
          MONGO_USER: test
          MONGO_PASS: test
          MONGO_HOST: localhost
          MONGO_PORT: "27017"
          MONGO_DB: cat_health_test
          FLASK_SECRET_KEY: ci-secret
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD_HASH: $2b$12$dummyhashforCIplaceholdervalueXXXXXXXXXXXXXXXXXXXXX

  frontend:
    name: Frontend (typecheck + build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck + build
        run: npm run build
      - name: Lint
        run: npm run lint

  test-stateful:
    name: Pytest (stateful)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mongomock
      - name: Run stateful tests
        run: pytest tests/stateful --tb=short --maxfail=1 -q
        env:
          # Defaults match the values used by tests; real secrets are not needed for mongomock.
          MONGO_USER: test
          MONGO_PASS: test
          MONGO_HOST: localhost
          MONGO_PORT: "27017"
          MONGO_DB: cat_health_test
          FLASK_SECRET_KEY: ci-secret
          ADMIN_USERNAME: admin
          ADMIN_PASSWORD_HASH: $2b$12$dummyhashforCIplaceholdervalueXXXXXXXXXXXXXXXXXXXXX