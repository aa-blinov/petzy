name: Diagnose server

# Read-only health check of the running stack. The repository is public,
# so its Actions logs are too: this prints container state, resource use,
# connectivity and error lines only, with usernames, IPs and emails
# masked. Nothing from the database is printed.

on:
  workflow_dispatch:
    inputs:
      restart_web:
        description: "Restart the web container after the checks"
        type: boolean
        default: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into petzy server and diagnose
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_PETZY_HOST }}
          username: ${{ secrets.SERVER_PETZY_USER }}
          key: ${{ secrets.SERVER_PETZY_SSH_KEY }}
          script: |
            set +e
            cd ~/services/cat-health-control-bot || exit 1
            mask() {
              sed -E \
                -e 's/(user|username|owner|created_by|pet_id|id)=[^ ,]+/\1=***/g' \
                -e 's/[0-9]{1,3}(\.[0-9]{1,3}){3}/x.x.x.x/g' \
                -e 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/***@***/g'
            }

            echo "=== containers ==="
            docker compose ps
            echo
            echo "=== resource use ==="
            docker stats --no-stream --format 'table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}\t{{.PIDs}}'
            echo
            echo "=== host ==="
            uptime; free -m | head -2; df -h / | tail -1

            echo
            echo "=== nginx -> web: /api/auth/session (expect 401 quickly) ==="
            docker compose exec -T nginx sh -c 'wget -q -S -O /dev/null -T 15 http://web:5000/api/auth/session 2>&1 | head -1' 2>&1
            echo
            echo "=== host: what listens on 80/443 and forwards to the stack ==="
            (ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null) | grep -E ':(80|443|3000) ' | sed -E 's/users:.*"([a-z0-9_.-]+)".*/\1/' | awk '{print $4, $NF}'
            echo "--- nginx config files"
            ls -la /etc/nginx /etc/nginx/sites-enabled /etc/nginx/sites-available /etc/nginx/conf.d 2>&1 | grep -v '^total' | awk '{print $1, $NF}'
            echo "--- directives (whole /etc/nginx, certbot/ssl lines skipped)"
            grep -rnE 'include|server_name|listen|client_max_body_size|proxy_pass|proxy_request_buffering|proxy_read_timeout|location|root ' /etc/nginx 2>&1 \
              | grep -vE 'mime.types|/modules-enabled|fastcgi|scgi|uwsgi|koi-|win-utf|snippets/' | mask | head -80
            echo "--- can this user reload nginx without a password?"
            sudo -n true 2>/dev/null && echo "sudo: yes" || echo "sudo: no"
            echo
            echo "=== inside web: gunicorn itself (expect 401 quickly) ==="
            docker compose exec -T web python -c "import urllib.request,time,urllib.error;t=time.time()
            try: urllib.request.urlopen('http://127.0.0.1:5000/api/auth/session', timeout=15)
            except urllib.error.HTTPError as e: print('HTTP', e.code, round(time.time()-t,2), 's')
            except Exception as e: print('FAIL', type(e).__name__, e, round(time.time()-t,2), 's')" 2>&1
            echo
            echo "=== inside web: MongoDB ping ==="
            docker compose exec -T web python -c "from web.db import client;import time;t=time.time();print(client.admin.command('ping'), round(time.time()-t,2),'s')" 2>&1 | tail -3 | mask

            echo
            echo "=== inside web: object storage (counts and statuses only) ==="
            docker compose exec -T web python - <<'PY' 2>&1 | grep -v "WARNING - Could not create index" | mask
            import logging, os, urllib.request, uuid
            logging.disable(logging.WARNING)
            from web import storage
            from web.app import db
            from web.helpers import load_image_variant
            print("configured:", storage.storage_configured(), "| key prefix:", repr(storage.key_prefix()))
            try:
                rules = storage._client().get_bucket_cors(Bucket=storage._bucket())["CORSRules"]
                print("CORS origins:", rules[0]["AllowedOrigins"], "methods:", sorted(rules[0]["AllowedMethods"]))
            except Exception as e:
                print("CORS: FAIL", type(e).__name__)
            key = f"healthcheck/server-{uuid.uuid4().hex}.txt"
            try:
                storage.put_bytes(key, b"petzy", "text/plain")
                ok_read = storage.get_bytes(key)[0] == b"petzy"
                with urllib.request.urlopen(storage.download_url(key, "attachment"), timeout=20) as r:
                    ok_signed = r.read() == b"petzy"
                storage.delete_object(key)
                print("write/read/signed/delete:", ok_read, ok_signed, "versions left:", len(list(storage._versions(key))))
            except Exception as e:
                print("write test: FAIL", type(e).__name__, e)
            def refs(coll, field):
                values = [str(d[field]) for d in db[coll].find({field: {"$nin": [None, ""]}}, {field: 1})]
                keys = [v for v in values if storage.is_storage_key(v)]
                present = sum(storage.object_size(k) is not None for k in keys)
                bad_prefix = sum(not k.startswith("users/") for k in keys)
                print(f"{coll}.{field}: {len(values)} refs, {len(keys)} in storage, {present} present,"
                      f" {len(values) - len(keys)} legacy, {bad_prefix} outside users/")
                return keys
            photos = refs("pets", "photo_file_id")
            refs("documents", "file_id")
            print("scan documents:", db.documents.count_documents({"scan": True}),
                  "| pending upload slots:", db.document_uploads.count_documents({}),
                  "| GridFS files left:", db["fs.files"].count_documents({}))
            from datetime import datetime, timezone
            now = datetime.now(timezone.utc)
            backups = sorted(storage.list_objects("backups/mongo/"), key=lambda b: b["key"], reverse=True)
            print(f"backups in backups/mongo/: {len(backups)}")
            for b in backups:
                age = (now - b["modified"]).total_seconds() / 3600
                print(f"  {b['key'].rsplit('/', 1)[-1]}  {b['size'] / 1024 / 1024:.1f} MB  {age:.1f} h ago")
            if photos:
                try:
                    data, content_type = load_image_variant(photos[0], 96, None)
                    print("thumbnail pipeline:", content_type, len(data) > 0)
                except Exception as e:
                    print("thumbnail pipeline: FAIL", type(e).__name__)
            PY
            echo "--- backup service log (last lines)"
            docker compose logs --no-color --tail 15 backup 2>&1 | mask
            echo "--- storage-related errors in web logs since start"
            docker compose logs --no-color web 2>&1 | grep -iE "storage|s3|boto|ClientError|bucket" | grep -iE "error|fail|warn|exception" | mask | tail -10
            echo "(end)"
            echo
            echo "=== web: what each gunicorn thread is blocked on (from /proc) ==="
            # The image has no ps/py-spy; /proc still shows, per thread, its
            # state, kernel wait channel and current syscall, and the fds it
            # holds (socket, pipe, ...), which is enough to tell a lock from
            # a stuck network read from a blocked log write.
            docker compose exec -T web python - <<'PY' 2>&1 | mask
            import os
            def rd(p):
                try:
                    return open(p).read().strip()
                except Exception as e:
                    return f"?({type(e).__name__})"
            for pid in sorted(int(p) for p in os.listdir('/proc') if p.isdigit()):
                cmd = rd(f'/proc/{pid}/cmdline').replace('\x00', ' ')[:60]
                if 'gunicorn' not in cmd:
                    continue
                print(f"pid {pid}: {cmd}")
                for tid in sorted(os.listdir(f'/proc/{pid}/task'), key=int):
                    base = f'/proc/{pid}/task/{tid}'
                    state = rd(f'{base}/stat').split(') ')[-1].split()[0]
                    wchan = rd(f'{base}/wchan')
                    sc = rd(f'{base}/syscall').split()
                    fd_desc = ''
                    if len(sc) > 1 and sc[0] in ('0', '1', '7', '45', '202', '232', '270', '281'):
                        try:
                            fd = int(sc[1], 16)
                            fd_desc = os.readlink(f'/proc/{pid}/fd/{fd}')
                        except Exception:
                            pass
                    print(f"   tid {tid}: state={state} wchan={wchan} syscall={sc[0] if sc else '?'} {fd_desc}")
                fds = []
                for fd in os.listdir(f'/proc/{pid}/fd'):
                    try:
                        fds.append(os.readlink(f'/proc/{pid}/fd/{fd}').split(':')[0])
                    except Exception:
                        pass
                print("   fds:", {k: fds.count(k) for k in set(fds)})
                # Who is on the other end of each socket: a client of
                # gunicorn (local port 5000) from the docker network (nginx)
                # or from outside, or MongoDB (remote port 27017).
                inodes = set()
                for fd in os.listdir(f'/proc/{pid}/fd'):
                    try:
                        link = os.readlink(f'/proc/{pid}/fd/{fd}')
                    except Exception:
                        continue
                    if link.startswith('socket:['):
                        inodes.add(link[8:-1])
                states = {'01': 'ESTABLISHED', '06': 'TIME_WAIT', '08': 'CLOSE_WAIT', '0A': 'LISTEN', '04': 'FIN_WAIT1', '05': 'FIN_WAIT2', '09': 'LAST_ACK'}
                kinds = {}
                for line in open('/proc/net/tcp').read().splitlines()[1:]:
                    f = line.split()
                    if f[9] not in inodes:
                        continue
                    lport = int(f[1].split(':')[1], 16)
                    rhex, rport = f[2].split(':')
                    rport = int(rport, 16)
                    first_octet = int(rhex[6:8], 16)
                    private = first_octet in (10, 127, 172, 192)
                    if lport == 5000 and f[3] == '0A':
                        kind = 'listen'
                    elif lport == 5000:
                        kind = 'client via ' + ('docker net' if private else 'EXTERNAL')
                    elif rport == 27017:
                        kind = 'mongo'
                    else:
                        kind = f'other:{rport}'
                    key = f"{kind} {states.get(f[3], f[3])}"
                    kinds[key] = kinds.get(key, 0) + 1
                print("   sockets:", kinds)
            PY
            echo
            echo "=== web: error lines, last 12h (masked) ==="
            docker compose logs --since 12h web 2>&1 | grep -Ei 'error|exception|traceback|critical|timeout|killed|booting|exiting|worker|signal' | tail -60 | mask
            echo
            echo "=== web: last 25 lines (masked) ==="
            docker compose logs --tail 25 web 2>&1 | mask
            echo
            echo "=== nginx: upstream errors, last 12h (masked) ==="
            docker compose logs --since 12h nginx 2>&1 | grep -Ei 'upstream|error|timed out|resolve' | tail -30 | mask

            if [ "${{ inputs.restart_web }}" = "true" ]; then
              echo
              echo "=== restarting web ==="
              docker compose restart web
              sleep 8
              docker compose ps web
              docker compose exec -T nginx sh -c 'wget -q -S -O /dev/null -T 15 http://web:5000/api/auth/session 2>&1 | head -1' 2>&1
            fi
