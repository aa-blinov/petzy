name: Clean server disk

# Frees disk space on the server. Without `apply` it only reports what
# takes the space and what could go. The repository is public, and so is
# this log: sizes by category only, no paths, no names.
#
# With `apply`, only what can be made again is removed:
#   - Docker images no container uses, and the build cache (the next
#     deploy rebuilds what it needs);
#   - system journal beyond 200 MB, and the package cache (as root);
#   - npm and pip download caches in the admin's home.
# Volumes are never removed here: one of them is the database. Unused
# volumes are only counted, with how many look like MongoDB data.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Remove unused Docker images, the build cache, old journal and the package cache"
        type: boolean
        default: false
      remove_vpn:
        description: "Remove Amnezia VPN entirely: its containers, images, volumes, networks and /opt/amnezia"
        type: boolean
        default: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: SSH into petzy server and clean
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5, pinned: this step holds the server's SSH key
        with:
          host: ${{ secrets.SERVER_PETZY_HOST }}
          username: ${{ secrets.SERVER_PETZY_USER }}
          key: ${{ secrets.SERVER_PETZY_SSH_KEY }}
          script: |
            set +e
            disk() { df -h / | awk 'NR==2 {print $5 " used, " $4 " free of " $2}'; }
            # No passwordless sudo on this server: measure through Docker, with
            # the host's disk mounted read-only in a throwaway container.
            size() { docker run --rm -v /:/host:ro alpine:3.24 du -sh "/host$1" 2>/dev/null | cut -f1; }
            # Root needs no sudo; anyone else needs it without a password.
            if [ "$(id -u)" = 0 ]; then as_root=""; can_sudo=yes
            elif sudo -n true 2>/dev/null; then as_root="sudo -n"; can_sudo=yes
            else as_root=""; can_sudo=no; fi

            echo "=== disk: $(disk) ==="
            echo "can clean system files: $can_sudo"
            echo
            echo "=== Docker ==="
            docker system df 2>/dev/null
            unused_images=$(docker images -q --filter dangling=false 2>/dev/null | sort -u | while read id; do
              docker ps -aq --filter ancestor="$id" | grep -q . || echo "$id"; done | wc -l)
            echo "images no container uses: $unused_images"
            dangling_volumes=$(docker volume ls -qf dangling=true 2>/dev/null)
            n_vol=$(echo "$dangling_volumes" | grep -c . )
            mongo_like=0
            for v in $dangling_volumes; do
              docker run --rm -v "$v":/v:ro alpine:3.24 test -e /v/WiredTiger 2>/dev/null && mongo_like=$((mongo_like+1))
            done
            echo "volumes no container uses: $n_vol (look like MongoDB data: $mongo_like), not touched"
            echo
            echo "=== outside Docker (sizes only) ==="
            echo "unused volumes' total size: $(for v in $dangling_volumes; do docker run --rm -v "$v":/v:ro alpine:3.24 du -sm /v 2>/dev/null | cut -f1; done | awk '{s+=$1} END {print s+0 " MB"}')"
            if true; then
              echo "system journal:  $(size /var/log/journal)"
              echo "other logs:      $(size /var/log)"
              echo "package cache:   $(size /var/cache/apt)"
              echo "snap packages:   $(size /var/lib/snapd)"
              echo "swap file:       $(ls -lh /swapfile 2>/dev/null | awk '{print $5}')"
              echo "all of Docker:   $(size /var/lib/docker)"
              echo "home folders:    $(size /home)"
              echo "root's home:     $(size /root)"
              # The largest items in the admin's home, named only when the name is
              # a well-known tool's (an editor's server, a cache); others «other».
              docker run --rm -v /root:/r:ro alpine:3.24 sh -c 'cd /r && du -sm .[!.]* * 2>/dev/null | sort -rn | head -8' 2>/dev/null \
                | awk 'BEGIN { split(".cache .npm .vscode-server .cursor-server .windsurf-server .local .docker .nvm .pyenv .rustup .cargo go snap services .git node_modules", k, " "); for (i in k) known[k[i]] = 1 }
                       { name = ($2 in known) ? $2 : "other"; printf "  %6d MB  %s\n", $1, name }'
              echo "temporary files: $(size /tmp)"
              echo "the system:      $(size /usr)"
            fi

            echo
            echo "=== Amnezia VPN (no longer used) ==="
            vpn_containers=$(docker ps -a --format '{{.Names}}' | grep -i '^amnezia' || true)
            vpn_images=$(docker images --format '{{.Repository}}:{{.Tag}} {{.ID}}' | grep -i 'amnezia' | awk '{print $2}' | sort -u || true)
            vpn_volumes=$(docker volume ls -q | grep -i 'amnezia' || true)
            vpn_networks=$(docker network ls --format '{{.Name}}' | grep -i 'amnezia' || true)
            echo "containers: $(echo "$vpn_containers" | grep -c .)  images: $(echo "$vpn_images" | grep -c .)  volumes: $(echo "$vpn_volumes" | grep -c .)  networks: $(echo "$vpn_networks" | grep -c .)"
            echo "/opt/amnezia: $(size /opt/amnezia)"
            if [ "${{ inputs.remove_vpn }}" = "true" ]; then
              for c in $vpn_containers; do docker rm -f "$c" >/dev/null 2>&1 && echo "container removed: $c"; done
              for i in $vpn_images; do docker rmi -f "$i" >/dev/null 2>&1 && echo "image removed"; done
              for v in $vpn_volumes; do docker volume rm "$v" >/dev/null 2>&1 && echo "volume removed"; done
              for n in $vpn_networks; do docker network rm "$n" >/dev/null 2>&1 && echo "network removed"; done
              if [ -d /opt/amnezia ]; then
                $as_root rm -rf /opt/amnezia 2>/dev/null || docker run --rm -v /opt:/o alpine:3.24 rm -rf /o/amnezia
                [ -d /opt/amnezia ] && echo "/opt/amnezia: still there" || echo "/opt/amnezia: removed"
              fi
              echo "left: containers $(docker ps -a --format '{{.Names}}' | grep -ci '^amnezia'), images $(docker images | grep -ci amnezia)"
            fi

            if [ "${{ inputs.apply }}" = "true" ]; then
              echo
              echo "=== cleaning ==="
              docker image prune -af >/dev/null 2>&1 && echo "unused Docker images: removed"
              docker builder prune -af >/dev/null 2>&1 && echo "build cache: removed"
              if [ "$can_sudo" = yes ]; then
                $as_root journalctl --vacuum-size=200M >/dev/null 2>&1 && echo "journal: trimmed to 200 MB"
                $as_root apt-get clean >/dev/null 2>&1 && echo "package cache: cleared"
              fi
              # Download caches in the admin's home: rebuilt on demand.
              rm -rf ~/.npm/_cacache 2>/dev/null && echo "npm cache: cleared"
              rm -rf ~/.cache/pip 2>/dev/null && echo "pip cache: cleared"
              echo
              echo "=== disk after: $(disk) ==="
              docker system df 2>/dev/null
            fi
