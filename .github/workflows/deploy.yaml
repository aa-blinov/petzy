name: Deploy to Server

on:
  # Starts once CI has finished on master; the job's `if` lets through only a
  # green push, or a manual run. The push trigger used to run next to CI, so a
  # commit that CI had not judged yet could reach production. workflow_run has
  # no paths filter, so the decide step skips docs-only commits instead.
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [master]
  # By hand, e.g. after adding or changing a secret (SMTP_*, S3_*).
  workflow_dispatch:

# One deploy at a time: two started together (a push and a manual run)
# ran `docker compose up` side by side, fought over container names, and
# left the site down until the next deploy. A waiting run is replaced by a
# newer one, and each run checks master again when its turn comes, so the newest
# commit is deployed and an older run arriving later skips.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    # A green CI run of a push to master, or a manual run. The event and repository
    # checks keep pull requests (including one from a fork's branch named master)
    # out of this job, which holds the server's SSH key.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      # Full history: the decide step compares the commit with the one in production.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # The one place that says whether this run deploys, and which commit.
      - name: Decide whether this run deploys
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Master as GitHub has it now. Read without a token: the repository is public.
          tip="$(git ls-remote "https://github.com/$REPO.git" refs/heads/master | cut -f1)"
          if [ -z "$tip" ]; then
            echo "::error::could not read master from GitHub"
            exit 1
          fi
          if [ "$EVENT" = "workflow_dispatch" ]; then
            # A manual run deploys master as it is now. Secrets reach .env only on a deploy.
            target="$tip"
          else
            target="$HEAD_SHA"
            if [ "$target" != "$tip" ]; then
              echo "::notice::Deploy skipped: master is at $tip now, newer than $target. The run for $tip deploys it."
              echo "deploy=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            # Docs and ops files change nothing the server runs. If everything since the
            # commit in production is one of them, nothing is rebuilt. Any doubt (no answer
            # from /api/version, a commit this clone lacks) deploys as usual.
            prod="$(curl -fsS --max-time 10 https://petzy.duckdns.org/api/version 2>/dev/null | jq -r '.commit // empty' 2>/dev/null || true)"
            if [ -n "$prod" ] && [ "$prod" != "$target" ] && git cat-file -e "$prod^{commit}" 2>/dev/null; then
              ignored() {
                case "$1" in
                  *.md | .impeccable/* | screenshots/* | .github/workflows/server_cleanup.yaml | .github/workflows/server_diagnose.yaml | .github/workflows/inspect_db.yaml | .github/workflows/storage_check.yaml) return 0 ;;
                  *) return 1 ;;
                esac
              }
              count=0
              only_ignored=true
              while IFS= read -r -d '' file; do
                count=$((count + 1))
                if ! ignored "$file"; then
                  only_ignored=false
                  break
                fi
              done < <(git diff --name-only -z "$prod" "$target")
              if [ "$count" -gt 0 ] && [ "$only_ignored" = true ]; then
                echo "::notice::Deploy skipped: since production's commit $prod only docs and ops files changed."
                echo "deploy=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi
            fi
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "sha=$target" >> "$GITHUB_OUTPUT"
      - name: Deploy to server
        if: steps.decide.outputs.deploy == 'true'
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2  # v1.2.5, pinned: this step holds the server's SSH key
        with:
          host: ${{ secrets.SERVER_PETZY_HOST }}
          username: ${{ secrets.SERVER_PETZY_USER }}
          key: ${{ secrets.SERVER_PETZY_SSH_KEY }}
          script: |
            # Without this, any failing command below (a diverged git pull,
            # a failed build) just gets skipped over silently — the job
            # still ends on `docker compose ps`, which always succeeds, so
            # GitHub reports a green "Deploy to Server" run that actually
            # deployed nothing new.
            set -euo pipefail

            # The commit this run deploys, as the decide step chose it.
            deploy_sha="${{ steps.decide.outputs.sha }}"

            # The repository (and so this log) is public: no listings of
            # the server's folders or paths here.
            echo "--- Navigating to project ---"
            cd ~/services/cat-health-control-bot || cd ~/services/cat-health-control || cd ~/cat-health-control || (echo "Project folder not found!" && exit 1)
            echo "--- Deployment ---"
            # First, before even git: every deploy builds fresh images, and
            # the old ones and the build cache stayed behind until the 20 GB
            # disk was full: MongoDB, unable to write, crashed on start (exit
            # 139), and then git itself couldn't fetch. Clear what a build
            # can make again: the build cache and images no container uses.
            # Never volumes: the database lives in one.
            echo "disk before: $(df -h / | awk 'NR==2 {print $5 " used, " $4 " free"}')"
            docker builder prune -af >/dev/null 2>&1 || true
            docker image prune -f >/dev/null 2>&1 || true
            echo "disk after cleanup: $(df -h / | awk 'NR==2 {print $5 " used, " $4 " free"}')"
            # `git pull` fails outright if the server's checkout has ever
            # diverged from origin/master (a stray local commit, a manual
            # edit to a tracked file) — this is a deploy target, not a dev
            # clone, so it should always end up exactly at the deployed commit
            # rather than needing someone to reconcile history by hand.
            git fetch origin master
            git reset --hard "$deploy_sha"

            # Push (Web Push/VAPID) is optional and reads its keys from
            # .env — an untracked file `git reset` never touches — so they
            # have to be kept in sync here instead. Upsert rather than
            # append: re-running this must update an existing line (e.g.
            # after rotating a key), not pile up duplicates.
            # Written as-is, not through sed: a password with «|» or «&» in
            # it came out mangled. cat > keeps the file's permissions.
            upsert_env() {
              { grep -v "^$1=" .env 2>/dev/null || true; printf '%s=%s\n' "$1" "$2"; } > .env.new
              cat .env.new > .env
              rm -f .env.new
            }
            # Which commit this deploy is, so /api/version can answer. .env is
            # already the web container's env_file, so nothing carries it by
            # hand. Rewritten every deploy, never a secret.
            upsert_env PETZY_BUILD_SHA "$deploy_sha"
            upsert_env VAPID_PUBLIC_KEY "${{ secrets.VAPID_PUBLIC_KEY }}"
            upsert_env VAPID_PRIVATE_KEY "${{ secrets.VAPID_PRIVATE_KEY }}"
            upsert_env VAPID_CLAIMS_EMAIL "${{ secrets.VAPID_CLAIMS_EMAIL }}"
            # Object storage (Backblaze B2) holds every file: photos,
            # documents, scans. Endpoint and bucket aren't secret; the key
            # pair is. Without it uploads answer "storage unavailable".
            upsert_env S3_ENDPOINT "https://s3.eu-central-003.backblazeb2.com"
            upsert_env S3_REGION "eu-central-003"
            upsert_env S3_BUCKET "petzy-1"
            upsert_env S3_KEY_ID "${{ secrets.S3_KEY_ID }}"
            upsert_env S3_SECRET_KEY "${{ secrets.S3_SECRET_KEY }}"
            # Mail for password recovery (web/mail.py). Written only when the
            # secret is set, so a value put on the server by hand stays.
            upsert_if_set() { [ -n "$2" ] && upsert_env "$1" "$2" || true; }
            upsert_if_set SMTP_HOST "${{ secrets.SMTP_HOST }}"
            upsert_if_set SMTP_PORT "${{ secrets.SMTP_PORT }}"
            upsert_if_set SMTP_USER "${{ secrets.SMTP_USER }}"
            upsert_if_set SMTP_PASSWORD "${{ secrets.SMTP_PASSWORD }}"
            upsert_if_set SMTP_FROM "${{ secrets.SMTP_FROM }}"
            # Sentry (web/observability.py, frontend/src/utils/observability.ts):
            # the DSN from the SENTRY_DSN secret; the release is this commit,
            # so an error says which deploy it came from.
            upsert_if_set SENTRY_DSN "${{ secrets.SENTRY_DSN }}"
            # The privacy policy's operator facts (public, so repository
            # variables rather than secrets; see web/legal.py).
            upsert_if_set PRIVACY_OPERATOR "${{ vars.PRIVACY_OPERATOR }}"
            upsert_if_set PRIVACY_CONTACT_EMAIL "${{ vars.PRIVACY_CONTACT_EMAIL }}"
            upsert_if_set PRIVACY_SERVER_LOCATION "${{ vars.PRIVACY_SERVER_LOCATION }}"
            upsert_env SENTRY_RELEASE "$(git rev-parse --short HEAD)"
            upsert_env SENTRY_ENVIRONMENT "production"

            # The app's own database account: read and write on the app's
            # database and the rate limiter's (`limits`), nothing else: no
            # other database, no user or server administration. Root
            # (MONGO_USER) stays for backups and admin work. The password is
            # made here once and lives only in the server's .env; it is never
            # printed, and mongosh reads it from the container's environment.
            upsert_env MONGO_APP_USER petzy_app
            grep -qE '^MONGO_APP_PASS=.+' .env || upsert_env MONGO_APP_PASS "$(openssl rand -hex 24)"

            # Rebuild everything that has its own Dockerfile / depends on the
            # backend source. Previously only `frontend` was rebuilt, which
            # meant backend changes (jti migration, ensure_indexes TTL,
            # refresh-token cleanup) never reached production — the `web`
            # container happily served a 3-week-old image.
            docker compose build
            # The build itself leaves a fresh cache; keep only what the next
            # build can reuse cheaply.
            docker image prune -f >/dev/null 2>&1 || true
            # A recreate cut short leaves this project's containers renamed
            # «<id>_cat-health-control-bot-…»; the next `up` then fails on the
            # name, halfway, with web already stopped (a 502 until fixed).
            # Clear those first, and if `up` still fails, clear and retry once.
            clear_stale() {
              # `|| true`: finding none is the usual case, and under pipefail
              # grep's «no match» would end the whole deploy.
              { docker ps -a --format '{{.Names}}' | grep -E '^[0-9a-f]{12}_cat-health-control-bot-' || true; } | xargs -r docker rm -f
            }
            clear_stale
            # The database first, with the app account in place, then the
            # rest: web and reminders sign in with that account.
            docker compose up -d --wait db || {
              echo "database did not start; its last log lines:"
              docker compose logs --no-color --tail 30 db 2>&1 | grep -viE "password|secret" || true
              sleep 5; clear_stale; docker compose up -d --wait db
            }
            app_user_js='
              const admin = db.getSiblingDB("admin");
              const user = process.env.MONGO_APP_USER, pwd = process.env.MONGO_APP_PASS;
              const roles = [{role: "readWrite", db: process.env.MONGO_INITDB_DATABASE}, {role: "readWrite", db: "limits"}];
              if (admin.getUser(user)) { admin.updateUser(user, {pwd: pwd, roles: roles}); print("app database account: updated"); }
              else { admin.createUser({user: user, pwd: pwd, roles: roles}); print("app database account: created"); }'
            docker compose exec -T db sh -c 'mongosh --quiet -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "$0"' "$app_user_js"
            docker compose up -d --remove-orphans || { sleep 5; clear_stale; docker compose up -d --remove-orphans; }
            docker compose ps
            # Files still in GridFS move to object storage; skips what has
            # moved already and does nothing when storage isn't configured.
            docker compose exec -T web python -m scripts.migrate_files_to_s3
      - name: Check that production answers with this commit
        if: steps.decide.outputs.deploy == 'true'
        env:
          EXPECTED: ${{ steps.decide.outputs.sha }}
        run: |
          # The public address, through the same host nginx and TLS that users
          # reach. Five minutes: the web container is recreated during a deploy.
          end=$((SECONDS + 300))
          while true; do
            served="$(curl -fsS --max-time 10 https://petzy.duckdns.org/api/version 2>/dev/null | jq -r '.commit // empty' 2>/dev/null || true)"
            if [ "$served" = "$EXPECTED" ]; then
              echo "production answers with $EXPECTED"
              exit 0
            fi
            if [ "$SECONDS" -ge "$end" ]; then
              echo "production answers with '${served:-no answer}', expected $EXPECTED"
              exit 1
            fi
            sleep 10
          done
      # The assistants' endpoint is not covered by the check above: a deploy after which the MCP server
      # never came back would still show green. Without a token /mcp answers 401 with the code
      # token_missing (mcp/petzy_mcp/http_app.py). Only that answer is read; no token is sent.
      - name: Check that the assistants' MCP endpoint answers
        if: steps.decide.outputs.deploy == 'true'
        run: |
          end=$((SECONDS + 300))
          answer="$RUNNER_TEMP/mcp-answer.json"
          while true; do
            code="$(curl -s --max-time 10 -o "$answer" -w '%{http_code}' -X POST https://petzy.duckdns.org/mcp -H 'Content-Type: application/json' -d '{}' || true)"
            if [ "$code" = "401" ] && [ "$(jq -r '.code // empty' "$answer" 2>/dev/null)" = "token_missing" ]; then
              echo "mcp answers 401 token_missing without a token"
              exit 0
            fi
            if [ "$SECONDS" -ge "$end" ]; then
              echo "mcp answered '${code:-no answer}', expected 401 token_missing"
              exit 1
            fi
            sleep 10
          done
