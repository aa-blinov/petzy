<!doctype html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <!-- ?v=2: the old favicon.svg was served "immutable" for a year, so
       browsers that have it would never ask for the new one. -->
  <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Pet health tracking application" />

  <!-- Fonts Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=DynaPuff:wght@400..700&display=swap" rel="stylesheet">

  <!-- iOS PWA meta tags -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Petzy" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="apple-touch-fullscreen" content="yes" />

  <!-- The navbar's own colours, so the browser chrome continues it. -->
  <meta name="theme-color" content="#252220" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#FEFCF6" media="(prefers-color-scheme: light)" />
  <title>Petzy</title>
  <script>
    (function () {
      try {
        var theme = localStorage.getItem('theme') || 'system';
        var root = document.documentElement;
        var isDark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (isDark) {
          root.setAttribute('data-prefers-color-scheme', 'dark');
          root.classList.add('dark');
        } else {
          root.setAttribute('data-prefers-color-scheme', 'light');
          root.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
